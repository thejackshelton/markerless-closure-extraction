# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Local Boundary Model Research"
  slug: "local-boundary-model-research"
  kind: specific
  tranche: "Research the best local fast code-aware model strategy for recursive cross-file boundary classification."
  status: done
  oracle:
    signal: "A source-backed recommendation names a default local model/runtime, fallback tiers, and eval plan for classifying Yuku-derived boundary candidates."
    cadence: "after Scout research and final Judge audit"
    final_proof: "Final Judge receipt maps recommendation evidence to local/offline, speed, code-awareness, hardware reach, structured output, and deterministic compiler constraints."
  intake:
    original_request: "Do grep MCP research on the best possible model for recursive cross-file analysis to determine boundaries."
    interpreted_outcome: "Choose a practical local model strategy for classifying boundary candidates produced by recursive Yuku/import analysis."
    input_shape: specific
    audience: "framework/tooling author"
    authority: requested
    proof_type: source_backed_answer
    completion_proof: "A concise recommendation backed by mcp__grep and primary model evidence."
    likely_misfire: "Selecting an impressive but too-large agentic coding model instead of a fast local classifier for edit-loop use."
    blind_spots_considered:
      - "Model must run locally for an OSS framework default."
      - "The model sees compact evidence chains, not raw repos."
      - "Inference latency matters more than broad coding-agent ability."
      - "Compiler/build remains deterministic and manifest-only."
    existing_plan_facts:
      - "Yuku produces ASTs on edit."
      - "Recursive graph analysis follows imports until host boundary, manifest entry, external boundary, unresolved symbol, cycle, or budget."
      - "The model classifies only compact unresolved boundary candidates."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/local-boundary-model-research/"
    command: "npx goalbuddy board docs/goals/local-boundary-model-research"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Use mcp__grep to gather real-world evidence for local fast code-aware models and runtimes used in OSS tooling."
    inputs:
      - "mcp__grep searches for model IDs and runtime config patterns such as Qwen2.5-Coder, Qwen3, StarCoder2, Phi, Ollama, llama.cpp, GGUF, MLX, ONNX, and structured JSON classification."
    constraints:
      - "Read-only."
      - "Use literal code/config patterns with mcp__grep, not vague keyword searches."
      - "Record repositories/patterns that indicate practical local deployment or model defaults."
      - "Do not implement integration."
    expected_output:
      - "Real-world usage evidence"
      - "Candidate model/runtime shortlist"
      - "Risks and gaps"
      - "Sources to validate with primary model cards/docs"
    receipt:
      result: done
      note: "notes/T001-grep-evidence.md"
      summary: "mcp__grep evidence clusters around Qwen2.5-Coder 1.5B/3B via Ollama, GGUF, llama.cpp, and MLX/WebGPU; Qwen3 4B appears as a stronger local general tier; StarCoder2 3B appears mostly for FIM/autocomplete. Ollama JSON/structured-output patterns are common enough for a closed-label classifier."
      evidence:
        - "zed-industries/zed: qwen2.5-coder:1.5b Ollama model handling."
        - "voideditor/void: qwen2.5-coder:1.5b listed as downloadable ~.986GB, 32k context, recommended Ollama model."
        - "continuedev/continue: local onboarding uses qwen2.5-coder:1.5b-base for FIM and maps Qwen2.5-Coder Ollama sizes."
        - "ggml-org/llama.cpp: tool_bench includes Qwen2.5-Coder 0.5B/1.5B/3B/7B/32B Q4_K_M with GGUF and Ollama IDs."
        - "ggml-org/llama.vscode: llama-server commands for Qwen2.5-Coder 1.5B CPU-only/<=8GB and 3B <=16GB."
        - "moltis-org/moltis: Qwen2.5-Coder 1.5B Q4_K_M local registry entry with min_ram_gb 4 and context_window 32768."
        - "langchain/mem0/LightRAG/Agno/agent-framework: Ollama JSON or JSON-schema output patterns."
      shortlist:
        - "Default candidate: Qwen2.5-Coder 1.5B Instruct Q4_K_M via Ollama/GGUF."
        - "Quality tier: Qwen2.5-Coder 3B or Qwen3 4B after eval."
        - "Completion-only alternative: StarCoder2 3B, but likely not default for JSON classification."
      spawned_tasks:
        - T002
  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Validate shortlisted models with primary model cards/docs and hardware/license constraints."
    inputs:
      - "T001 receipt"
    constraints:
      - "Read-only."
      - "Prefer official Hugging Face model cards, llama.cpp/Ollama docs, or vendor docs."
      - "Do not rely on generic ranking posts unless primary sources are missing."
    expected_output:
      - "Primary-source model facts"
      - "Hardware and license notes"
      - "Structured-output suitability"
    receipt:
      result: done
      note: "notes/T002-primary-validation.md"
      summary: "Primary model cards/docs validate Qwen2.5-Coder 1.5B as the strongest default local code-aware classifier candidate; Qwen3 4B is a better-quality tier with GGUF/Ollama support; Qwen2.5-Coder 7B is a high-quality but heavier tier; StarCoder2 3B is FIM-oriented and not a strong instruction classifier default. Ollama supports JSON/schema outputs for closed-label classification."
      evidence:
        - "Qwen2.5-Coder 1.5B HF card: Apache-2.0, code-specific, 1.54B params, 32,768 context."
        - "Qwen2.5-Coder 7B HF card: Apache-2.0, 7.61B params, 131,072 context."
        - "Qwen3-4B-GGUF HF card: Apache-2.0, 4B params, Q4_K_M quantization, llama.cpp/Ollama support, 32,768 native context."
        - "StarCoder2 3B HF card: code/FIM model but not an instruction model; BigCode OpenRAIL-M license."
        - "Ollama docs: structured outputs support `format: json` and JSON schema."
      spawned_tasks:
        - T003
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: default
    objective: "Choose the recommended local model strategy for the boundary classifier."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
    constraints:
      - "Read-only."
      - "Optimize for fast edit-loop classification over broad agentic coding ability."
      - "Reject any model that is not practical on common developer hardware."
    expected_output:
      - "Default model/runtime"
      - "Fallback tiers"
      - "Prompt/input contract"
      - "Eval plan"
      - "full_outcome_complete: true | false"
    receipt:
      result: done
      decision: "Use Qwen2.5-Coder 1.5B Instruct quantized locally behind Ollama-first structured output as the default classifier strategy."
      note: "notes/T003-recommendation.md"
      summary: "Recommend a local classifier strategy: Ollama first with llama.cpp/GGUF compatibility, defaulting to Qwen2.5-Coder 1.5B Instruct in a small quantized form; use Qwen2.5-Coder 3B/Qwen3 4B as quality tiers, Qwen2.5-Coder 7B for workstations, static unresolved diagnostics when no model is available, and avoid StarCoder2 3B as the default classifier. The model sees compact Yuku/import evidence chains and emits validated JSON proposals; deterministic compiler/build state stays manifest-based."
      default_model_runtime: "Qwen2.5-Coder 1.5B Instruct quantized locally, Ollama first, llama.cpp/GGUF compatible."
      fallback_tiers:
        - "Qwen2.5-Coder 3B or Qwen3 4B Q4_K_M for better quality if latency is acceptable."
        - "Qwen2.5-Coder 7B for workstation-quality classification."
        - "Static deterministic classifier plus unresolved diagnostics and manual manifest when no local model is available."
      prompt_contract: "Closed JSON/schema classifier over compact Yuku-derived evidence chains; invalid or low-confidence output becomes unknown."
      eval_plan: "Fixture-driven measurement across direct events, wrappers, re-exports, aliases, spreads, external packages, server/resource markers, false positives, cycles, and unresolved symbols; measure F1, high-confidence false positives, unknown rate, invalid JSON, stability, latency, load time, RAM, and manifest churn."
      full_outcome_complete: true
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: default
    objective: "Audit whether the recommendation satisfies the research objective."
    inputs:
      - "All done task receipts"
    constraints:
      - "Read-only."
      - "Reject completion if mcp__grep evidence is missing."
      - "Reject completion if recommendation does not address local/offline, speed, code-awareness, hardware reach, structured output, and deterministic compiler constraints."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
    receipt:
      result: done
      decision: complete
      note: "notes/T999-final-audit.md"
      summary: "Final audit confirms the recommendation satisfies the research objective and covers mcp__grep evidence, primary validation, local/offline runtime, edit-loop speed, code-awareness, hardware reach, structured output, and deterministic compiler constraints."
      full_outcome_complete: true
      missing_evidence: []

checks:
  dirty_fingerprint: "research board only"
  last_verification:
    result: pass
