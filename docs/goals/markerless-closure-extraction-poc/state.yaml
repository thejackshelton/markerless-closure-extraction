# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Markerless Closure Extraction POC"
  slug: "markerless-closure-extraction-poc"
  kind: existing_plan
  tranche: "Complete the first narrow POC milestone on a generated React app shape: cross-file deterministic inferred boundary manifest generation and closure reporting from normal TSX."
  status: done
  oracle:
    signal: "`pnpm poc` reads a generated React TSX source tree across files, parses it with Yuku, persists a classifier whitelist that yields Button.onPress = event from Button.tsx into App.tsx, writes closure-boundaries.json, reports extractable closures, and verifies the generated outputs."
    cadence: "after each Worker package and at final audit"
    final_proof: "A final audit maps current files and command output back to every explicit requirement and records full_outcome_complete: true."
  intake:
    original_request: "Prepare and execute a GoalBuddy run for a markerless-closure-extraction POC."
    interpreted_outcome: "A fresh repo can run one documented command proving deterministic inferred boundary manifest generation from unmarked callbacks in a generated cross-file React app."
    input_shape: existing_plan
    audience: "project author"
    authority: requested
    proof_type: demo
    completion_proof: "Fresh clone/install can run `pnpm poc` against the generated React app demo and see `closure-boundaries.json` generated from cross-file source with Button.onPress = event and no explicit marker in the source callback."
    likely_misfire: "Overbuilding resumability, TSRX, a runtime/framework, or LLM-dependent compilation instead of proving deterministic manifest inference."
    blind_spots_considered:
      - "The target directory may be empty and need a minimal package scaffold."
      - "Dependency installation may be unavailable under sandboxed network conditions."
      - "Build/report must consume persisted manifest data, not live classifier output."
      - "Classifier fallback must be deterministic and fixture-backed."
      - "Do not maintain a hardcoded event-name map or compiler-side boundary detector; collect AST candidates and persist classifier decisions."
    existing_plan_facts:
      - "Use normal TSX/JSX."
      - "Use Yuku parser for TSX/JSX parsing so analysis consumes an AST, not regex or code-prediction guesses."
      - "Do not hold a catalog of DOM event names; the POC should collect candidate boundary surfaces from parsed JSX structure."
      - "The demo should now be generated React TSX source, not a single-file synthetic fixture."
      - "Cross-file analysis is required: App.tsx should import/use Button from another file, and Button.tsx should reveal the boundary candidate."
      - "Do not build a full framework."
      - "Do not implement full resumability."
      - "Do not start with TSRX."
      - "React is acceptable for the demo shape; the POC is about cross-file TSX analysis, not runtime behavior."
      - "Keep the POC framework-agnostic where possible."
      - "AST analysis should identify candidate boundary surfaces such as button.onClick."
      - "Classifier output should whitelist event intent and allow propagation through user components such as Button.onPress -> button.onClick."
      - "Write deterministic closure-boundaries.json."
      - "Transform or report callback closures extractable/lazy-loadable based on the persisted manifest."
      - "Provide `pnpm poc` as the end-to-end proof command."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/markerless-closure-extraction-poc/"
    command: "npx goalbuddy board docs/goals/markerless-closure-extraction-poc"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Inspect the repo shape and choose the smallest implementation path for the requested POC."
    inputs:
      - "."
      - "docs/goals/markerless-closure-extraction-poc/goal.md"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Prefer concrete file-path evidence over assumptions."
      - "Preserve the user's narrow POC scope."
    expected_output:
      - "Repo shape summary"
      - "Smallest implementation path"
      - "Verification commands"
      - "Candidate Worker task with allowed_files, verify, and stop_if"
    receipt:
      result: done
      summary: "Repo is effectively empty aside from GoalBuddy files, so the smallest implementation path is a zero-dependency Node CLI package with a demo TSX fixture, deterministic analyzer, manifest writer, closure reporter, and verification script behind `pnpm poc`."
      evidence:
        - "find . -maxdepth 4 -type f only listed goal.md and state.yaml before implementation."
        - "No .git directory is present."
        - "`node --version` -> v24.15.0"
        - "`pnpm --version` -> 10.33.2"
      smallest_implementation_path:
        - "Create package.json with `poc` script running a local Node ESM CLI."
        - "Store the target demo as normal TSX/JSX with no callback/QRL marker."
        - "Implement Yuku AST scanning for the narrow proof: candidate boundary surfaces, user component prop propagation, deterministic manifest serialization, and closure reporting from persisted manifest."
        - "Include a pluggable classifier interface with deterministic mock fixture outputs, and use the fixture to label button.onClick as an event boundary."
        - "Run verification inside `pnpm poc` and fail if `Button.onPress = event` is not generated."
      verification_commands:
        - "pnpm poc"
      spawned_tasks:
        - T002
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: default
    objective: "Review Scout findings and approve the largest safe useful Worker slice."
    inputs:
      - "T001 receipt"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Reject any plan that builds a framework, runtime, TSRX, or resumability."
      - "Require a deterministic persisted-manifest proof."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred tasks"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The Scout result proves an empty repo with Node and pnpm available. A single zero-dependency Worker slice can safely create the full POC without building a framework/runtime, requiring TSRX, or depending on live model output."
      exact_worker_objective: "Create a minimal package where `pnpm poc` uses Yuku parser to parse demo TSX/JSX into an AST, collects candidate boundary surfaces without a hardcoded event-name map or compiler-side boundary detector, uses deterministic classifier plumbing to whitelist button.onClick, propagates Button.onPress to button.onClick, writes deterministic closure-boundaries.json, reports closures based on the persisted manifest, and verifies the generated output."
      allowed_files:
        - "package.json"
        - "pnpm-lock.yaml"
        - "README.md"
        - "demo/App.tsx"
        - "src/pipeline.mjs"
        - "scripts/poc.mjs"
        - "fixtures/mock-classifier.json"
        - "closure-boundaries.json"
      verify:
        - "pnpm poc"
        - "node --check src/pipeline.mjs"
        - "node --check scripts/poc.mjs"
      stop_if:
        - "Need external npm packages beyond the requested Yuku parser."
        - "Need to build a framework/runtime, TSRX parser, or resumability layer."
        - "The manifest cannot be derived deterministically from source plus persisted fixtures."
      deferred_tasks:
        - "A real parser or richer classifier can be evaluated after this POC proves the narrow manifest hypothesis."
  - id: T003
