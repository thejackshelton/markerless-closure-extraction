        - "pnpm-lock.yaml"
        - "README.md"
        - "demo/App.tsx"
        - "src/pipeline.mjs"
        - "scripts/poc.mjs"
        - "fixtures/mock-classifier.json"
        - "closure-boundaries.json"
      commands:
        - cmd: "pnpm install"
          status: pass
        - cmd: "node --check src/pipeline.mjs"
          status: pass
        - cmd: "node --check scripts/poc.mjs"
          status: pass
        - cmd: "CI=true pnpm install --frozen-lockfile"
          status: pass
        - cmd: "pnpm poc"
          status: pass
      summary: "Built the Yuku-parser-based POC. The analyzer parses normal TSX into a Yuku AST, collects JSX prop-forwarding candidates, uses a deterministic classifier fixture to whitelist button.onClick as an event boundary, writes closure-boundaries.json with Button.onPress = event, then reports the App callback closure from the persisted manifest."
